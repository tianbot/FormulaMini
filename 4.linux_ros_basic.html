<h2 id="%F0%9F%8E%AF-%E6%88%91%E4%BB%AC%E7%9A%84%E6%8C%91%E6%88%98%E7%9B%AE%E6%A0%87"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> 我们的挑战目标</h2>
<ul>
<li>像极客一样操控 <strong>Linux 终端</strong> <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4bb.svg" data-marp-twemoji=""/></li>
<li>玩转文件地图与权限魔法 <img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4c1.svg" data-marp-twemoji=""/></li>
<li>掌握 <strong>ROS</strong> 核心指令，指挥机器人 <img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/></li>
<li>独立完成你的第一个 ROS 模拟挑战 <img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3c6.svg" data-marp-twemoji=""/></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%F0%9F%91%A5-%E8%B0%81%E9%80%82%E5%90%88%E8%BF%99%E9%97%A8%E8%AF%BE"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f465.svg" data-marp-twemoji=""/> 谁适合这门课？</h2>

<li>想要变身技术大牛的入门者</li>
<li>第一次接触 Linux 的“萌新”</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h1 id="1%EF%B8%8F%E2%83%A3-%E6%96%87%E4%BB%B6%E4%B8%8E%E7%9B%AE%E5%BD%95%E9%AD%94%E6%B3%95-%F0%9F%93%81"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/31-20e3.svg" data-marp-twemoji=""/> 文件与目录魔法 <img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4c1.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="11-%E6%88%91%E7%9A%84%E5%9C%B0%E5%9B%BE%E5%9C%A8%E5%93%AA%E5%AF%BC%E8%88%AA">1.1 我的“地图”在哪？(导航)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">pwd</span>                 <span class="hljs-comment"># 【我在哪？】显示当前位置</span>
<span class="hljs-built_in">ls</span>                  <span class="hljs-comment"># 【这有什么？】列出文件</span>
<span class="hljs-built_in">ls</span> -la              <span class="hljs-comment"># 【火眼金睛】显示包括隐藏文件</span>
<span class="hljs-built_in">cd</span> Desktop          <span class="hljs-comment"># 【瞬移】去桌面文件夹</span>
<span class="hljs-built_in">cd</span> ..               <span class="hljs-comment"># 【退一步】返回上一层</span>
<span class="hljs-built_in">cd</span> ~                <span class="hljs-comment"># 【回家】回主目录</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="12-%E5%8F%98%E5%87%BA%E6%96%87%E4%BB%B6%E4%B8%8E%E6%96%87%E4%BB%B6%E5%A4%B9-%E5%88%9B%E5%BB%BA">1.2 变出文件与文件夹 (创建)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">mkdir</span> project       <span class="hljs-comment"># 【盖房子】创建新文件夹</span>
<span class="hljs-built_in">touch</span> hello.txt     <span class="hljs-comment"># 【点点点】创建空文件</span>
<span class="hljs-built_in">cp</span> file1 file2      <span class="hljs-comment"># 【分身术】复制文件</span>
<span class="hljs-built_in">mv</span> file1 file2      <span class="hljs-comment"># 【搬家】移动或改名</span>
<span class="hljs-built_in">rm</span> test.txt         <span class="hljs-comment"># 【橡皮擦】删除文件</span>
<span class="hljs-built_in">rm</span> -rf folder       <span class="hljs-comment"># 【终极毁灭】删除文件夹（极其危险！！）</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>警告</strong>：在 Linux 里没有“回收站”，<code>rm -rf</code> 用错可能会毁掉整个系统！</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="1️⃣ Linux 基础命令" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="7" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:1️⃣ Linux 基础命令;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Linux 基础命令</header>

<h1 id="2%EF%B8%8F%E2%83%A3-%E6%96%87%E4%BB%B6%E5%A4%A7%E6%8F%AD%E7%A7%98-%F0%9F%91%81%EF%B8%8F%E2%80%8D%F0%9F%97%A8%EF%B8%8F"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/32-20e3.svg" data-marp-twemoji=""/> 文件大揭秘 <img class="emoji" draggable="false" alt="👁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f441.svg" data-marp-twemoji=""/>‍<img class="emoji" draggable="false" alt="🗨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5e8.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="21-%E5%81%B7%E7%9C%8B%E6%96%87%E4%BB%B6%E5%86%85%E5%AE%B9">2.1 偷看文件内容</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">cat</span> hint.txt        <span class="hljs-comment"># 【一览无余】显示全部内容</span>
<span class="hljs-built_in">head</span> list.txt       <span class="hljs-comment"># 【看个头】显示前10行</span>
<span class="hljs-built_in">tail</span> log.txt        <span class="hljs-comment"># 【看个尾】显示最后10行</span>
<span class="hljs-built_in">tail</span> -f log.txt     <span class="hljs-comment"># 【监控器】实时刷新，看日志变动</span>
less file.txt       <span class="hljs-comment"># 【翻书模式】上下翻页看大文件</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="22-%E6%96%87%E6%9C%AC%E7%BC%96%E8%BE%91%E5%99%A8%E4%BD%A0%E7%9A%84%E7%AC%94%E8%AE%B0%E6%9C%AC">2.2 文本编辑器：你的笔记本</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">nano file.txt       <span class="hljs-comment"># 【极速上手】最简单的编辑器</span>
vim file.txt        <span class="hljs-comment"># 【大师之路】高手专用（需要学习按键）</span>
gedit file.txt      <span class="hljs-comment"># 【像记事本】打开图形窗口编辑</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="23-%E5%AF%BB%E5%AE%9D%E6%8E%A2%E9%99%A9-%E6%90%9C%E7%B4%A2">2.3 寻宝探险 (搜索)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">find /home -name <span class="hljs-string">&quot;*.txt&quot;</span>     <span class="hljs-comment"># 【寻宝】按名字找文件</span>
grep <span class="hljs-string">&quot;秘密&quot;</span> hint.txt          <span class="hljs-comment"># 【关键词锁死】找文中的话</span>
grep -r <span class="hljs-string">&quot;error&quot;</span> ./           <span class="hljs-comment"># 【地毯式搜寻】递归查找目录</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="1️⃣ Linux 基础命令" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:1️⃣ Linux 基础命令;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Linux 基础命令</header>

<h1 id="3%EF%B8%8F%E2%83%A3-%E7%B3%BB%E7%BB%9F%E5%A4%A7%E7%AE%A1%E5%AE%B6-%E2%9A%99%EF%B8%8F"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/33-20e3.svg" data-marp-twemoji=""/> 系统大管家 <img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2699.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="31-%E6%9F%A5%E7%9C%8B%E7%B3%BB%E7%BB%9F%E7%8A%B6%E6%80%81">3.1 查看系统状态</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">uname</span> -a            <span class="hljs-comment"># 【自我介绍】查看系统版本</span>
<span class="hljs-built_in">df</span> -h               <span class="hljs-comment"># 【硬盘空间】看看硬盘满没满</span>
free -h             <span class="hljs-comment"># 【体力值】看看内存够不够</span>
top                 <span class="hljs-comment"># 【热榜】实时看哪个进程最忙</span>
htop                <span class="hljs-comment"># 【高级版热榜】更漂亮的界面</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="32-%E7%BB%88%E7%BB%93%E6%8D%A3%E8%9B%8B%E9%AC%BC-%E8%BF%9B%E7%A8%8B%E7%AE%A1%E7%90%86">3.2 终结捣蛋鬼 (进程管理)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">ps aux              <span class="hljs-comment"># 【列队清单】看所有在运行的程序</span>
ps aux | grep ros   <span class="hljs-comment"># 【精准打击】找出 ROS 相关程序</span>
<span class="hljs-built_in">kill</span> 1234           <span class="hljs-comment"># 【强制下课】杀死 PID 为 1234 的程序</span>
killall roscore     <span class="hljs-comment"># 【一网打尽】结束所有同名程序</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="1️⃣ Linux 基础命令" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:1️⃣ Linux 基础命令;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Linux 基础命令</header>

<h1 id="4%EF%B8%8F%E2%83%A3-%E6%9D%83%E9%99%90%E4%B8%8E%E8%BF%9E%E6%8E%A5-%F0%9F%94%91"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/34-20e3.svg" data-marp-twemoji=""/> 权限与连接 <img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f511.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="41-%E8%8E%B7%E5%BE%97%E8%B6%85%E7%BA%A7%E5%8A%9B%E9%87%8F">4.1 获得超级力量</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">chmod</span> +x script.sh      <span class="hljs-comment"># 【赋予能量】让程序变“可执行”</span>
<span class="hljs-built_in">chmod</span> 755 file          <span class="hljs-comment"># 【调整权杖】设置具体权限</span>
<span class="hljs-built_in">sudo</span> <span class="hljs-built_in">command</span>            <span class="hljs-comment"># 【变身管理员】以 Super User 身份干活</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="42-%E7%BD%91%E7%BB%9C%E7%A9%BF%E6%A2%AD">4.2 网络穿梭</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">ip addr                 <span class="hljs-comment"># 【查门牌号】看电脑的 IP 地址</span>
ping 192.168.1.1        <span class="hljs-comment"># 【喂？还在吗？】测网络连通性</span>
ssh pi@192.168.1.10     <span class="hljs-comment"># 【灵魂附身】远程登录其他机器人</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="🤖 ROS 核心指南" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:🤖 ROS 核心指南;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ROS 核心指南</header>

<h1 id="5%EF%B8%8F%E2%83%A3-ros-%E5%9F%BA%E7%A1%80%E5%BF%85%E6%9D%80%E6%8A%80-%F0%9F%A7%AD"><img class="emoji" draggable="false" alt="5️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/35-20e3.svg" data-marp-twemoji=""/> ROS 基础必杀技 <img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9ed.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="51-ros-%E5%A4%A7%E7%AE%A1%E5%AE%B6%E4%B8%8E%E8%BF%90%E8%A1%8C%E5%99%A8">5.1 ROS 大管家与运行器</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">roscore                 <span class="hljs-comment"># 【启动大脑】所有节点通信都需要它</span>
rosrun pkg_name node    <span class="hljs-comment"># 【请出一位演员】运行指定的节点</span>
roslaunch pkg name.launch <span class="hljs-comment"># 【剧组统筹】一次性启动一堆节点</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h1 id="%F0%9F%8E%AE-%E5%AE%9E%E6%88%98%E6%8C%91%E6%88%98%E7%8E%A9%E8%BD%AC%E5%B0%8F%E6%B5%B7%E9%BE%9F-turtlesim"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 实战挑战：玩转小海龟 (Turtlesim)</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E4%B8%80%E5%85%B3%E5%8F%AC%E5%94%A4%E6%B5%B7%E9%BE%9F%E6%88%98%E9%98%9F-%E5%90%AF%E5%8A%A8">第一关：召唤海龟战队 (启动)</h2>
<p>我们需要打开 <strong>3 个终端窗口</strong>，观察它们之间的秘密：</p>
<ol>
<li><strong>终端 1：启动大脑</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">roscore
</code></pre>
</li>
<li><strong>终端 2：启动小海龟模拟器</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosrun turtlesim turtlesim_node
</code></pre>
</li>
<li><strong>终端 3：启动海龟遥控器</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosrun turtlesim turtle_teleop_key
</code></pre>
</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>任务</strong>：点击“遥控器”终端，用方向键指挥海龟画一个五角星（或者乱动一下也行）！</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E4%BA%8C%E5%85%B3%E6%9F%A5%E7%9C%8B%E6%BC%94%E5%91%98%E5%90%8D%E5%8D%95-nodes">第二关：查看演员名单 (Nodes)</h2>
<p>在 ROS 的世界里，每个程序都叫一个“节点 (Node)”。</p>
<ol>
<li>
<p><strong>查看有哪些演员在场：</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosnode list
</code></pre>
<p><em>你应该能看到 <code>/turtlesim</code> 和 <code>/teleop_turtle</code></em></p>
</li>
<li>
<p><strong>打探某位演员的底细：</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosnode info /turtlesim
</code></pre>
<p><em>这里能看到它都在谈论什么话题 (Topics)</em></p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E4%B8%89%E5%85%B3%E9%80%8F%E8%A7%86%E5%85%B3%E7%B3%BB%E7%BD%91-rqt_graph">第三关：透视“关系网” (rqt_graph)</h2>
<p>想知道这些节点是怎么互相说话的吗？</p>
<p><strong>开一个新终端输入：</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rqt_graph
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>小贴士</strong>：你会看到一条线从 <code>teleop</code> 连向 <code>turtlesim</code>。就像电线一样，遥控器的指令通过话题发给了海龟！</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E5%9B%9B%E5%85%B3%E7%9B%91%E5%90%AC%E7%A7%98%E5%AF%86%E9%A2%91%E9%81%93-topics">第四关：监听秘密频道 (Topics)</h2>
<p>海龟的一举一动都会在“话题 (Topic)”通道里广播。</p>
<ol>
<li><strong>列出所有通话频道：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rostopic list
</code></pre>
</li>
<li><strong>实时“偷听指令”：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rostopic <span class="hljs-built_in">echo</span> /turtle1/cmd_vel
</code></pre>
<em>当你按方向键时，看看屏幕上刷出的速度数据！</em></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E4%BA%94%E5%85%B3%E5%8F%91%E5%B0%84%E9%AD%94%E6%B3%95%E6%8C%87%E4%BB%A4-pub">第五关：发射“魔法指令” (Pub)</h2>
<p>如果不按键盘，我们能不能直接用命令让它动起来？当然可以！</p>
<p><strong>在终端输入这段“咒语”（建议按 Tab 键自动补全）：</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rostopic pub -r 1 /turtle1/cmd_vel geometry_msgs/Twist <span class="hljs-string">&quot;linear:
  x: 2.0
  y: 0.0
  z: 0.0
angular:
  x: 0.0
  y: 0.0
  z: 1.8&quot;</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>效果</strong>：<code>-r 1</code> 让它每秒发 1 次指令。海龟会开始疯狂转圈圈！按 <code>Ctrl+C</code> 停止“魔法”。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E5%85%AD%E5%85%B3%E4%BF%AE%E6%94%B9%E8%83%8C%E6%99%AF%E9%AD%94%E6%B3%95-params">第六关：修改背景魔法 (Params)</h2>
<p>我们可以通过“参数 (Parameter)”动态改变它的环境。</p>
<ol>
<li><strong>看看有哪些环境参数：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosparam list
</code></pre>
</li>
<li><strong>改变背景色（试试变成深红色）：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosparam <span class="hljs-built_in">set</span> /turtlesim/background_b 50
rosparam <span class="hljs-built_in">set</span> /turtlesim/background_g 0
rosparam <span class="hljs-built_in">set</span> /turtlesim/background_r 150
</code></pre>
</li>
<li><strong>刷新画面：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosservice call /clear
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="%E7%AC%AC%E4%B8%83%E5%85%B3%E7%9E%AC%E9%97%B4%E8%BD%AC%E7%A7%BB-services">第七关：瞬间转移 (Services)</h2>
<p>如果你想再变出一只海龟，或者把现有的送回家？</p>
<ol>
<li><strong>瞬移海龟：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosservice call /turtle1/teleport_absolute 5.0 5.0 0.0
</code></pre>
</li>
<li><strong>召唤克隆体：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosservice call /spawn 3.0 3.0 0.0 <span class="hljs-string">&quot;new_turtle&quot;</span>
</code></pre>
<em>快看！(3,3) 的地方出现了一个新伙伴！</em></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="🤖 ROS 核心指南" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:🤖 ROS 核心指南;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ROS 核心指南</header>

<h1 id="6%EF%B8%8F%E2%83%A3-%E8%BF%9B%E9%98%B6%E6%93%8D%E4%BD%9Cros-%E5%B7%A5%E4%BD%9C%E7%A9%BA%E9%97%B4-%F0%9F%9B%A0%EF%B8%8F"><img class="emoji" draggable="false" alt="6️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/36-20e3.svg" data-marp-twemoji=""/> 进阶操作：ROS 工作空间 <img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="61-%E5%88%9B%E5%BB%BA%E4%BD%A0%E7%9A%84%E4%B8%93%E5%B1%9E%E9%A2%86%E5%9C%B0">6.1 创建你的专属领地</h2>
<p>在 ROS 里，所有的代码都要放在指定的工作空间 (Workspace) 里。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">mkdir</span> -p ~/catkin_ws/src        <span class="hljs-comment"># 1. 盖好房子</span>
<span class="hljs-built_in">cd</span> ~/catkin_ws/src
catkin_init_workspace           <span class="hljs-comment"># 2. 挂上牌匾</span>
<span class="hljs-built_in">cd</span> ~/catkin_ws
catkin_make                     <span class="hljs-comment"># 3. 装修编译</span>
<span class="hljs-built_in">source</span> devel/setup.bash         <span class="hljs-comment"># 4. 让电脑认识它</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="62-%E7%8E%AF%E5%A2%83%E5%8F%98%E9%87%8F%E8%AE%A9%E5%91%BD%E4%BB%A4%E6%B0%B8%E4%B9%85%E7%94%9F%E6%95%88">6.2 环境变量：让命令永久生效</h2>
<p>每次打开新终端都要 <code>source</code> 太麻烦了？你可以把命令写进电脑的“备忘录”：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 执行一次即可，以后开机自动生效</span>
<span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;source ~/catkin_ws/devel/setup.bash&quot;</span> &gt;&gt; ~/.bashrc
<span class="hljs-built_in">source</span> ~/.bashrc
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="🤖 ROS 核心指南" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:🤖 ROS 核心指南;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ROS 核心指南</header>

<h1 id="7%EF%B8%8F%E2%83%A3-%E5%B8%B8%E7%94%A8%E5%B7%A5%E5%85%B7%E7%AE%B1-%F0%9F%A7%B0"><img class="emoji" draggable="false" alt="7️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/37-20e3.svg" data-marp-twemoji=""/> 常用工具箱 <img class="emoji" draggable="false" alt="🧰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9f0.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="71-rviz%E6%9C%BA%E5%99%A8%E4%BA%BA%E7%9A%84-3d-%E7%9C%BC%E9%95%9C">7.1 RViz：机器人的 3D 眼镜</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rviz                            <span class="hljs-comment"># 启动可视化界面</span>
</code></pre>
<p><em>在 RViz 里，你可以看到激光雷达、地图、甚至是虚拟的机器人身体</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="72-rosbag%E6%97%B6%E5%85%89%E5%80%92%E6%B5%81%E5%BD%95%E5%83%8F%E6%9C%BA">7.2 rosbag：时光倒流录像机</h2>
<p>想把机器人的表现录下来回家研究？</p>
<ol>
<li><strong>开始录像（记录所有话题）：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosbag record -a
</code></pre>
</li>
<li><strong>停止并保存：</strong> <code>Ctrl + C</code></li>
<li><strong>重播视频（再现当时情景）：</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">rosbag play your_file_name.bag
</code></pre>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-header="💡 实用小知识" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--header:💡 实用小知识;--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<header><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 实用小知识</header>

<h1 id="8%EF%B8%8F%E2%83%A3-%E7%BB%88%E6%9E%81%E7%94%9F%E5%AD%98%E6%8A%80%E5%B7%A7-%E2%9A%A1"><img class="emoji" draggable="false" alt="8️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/38-20e3.svg" data-marp-twemoji=""/> 终极生存技巧 <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="81-%E6%95%91%E5%91%BD%E5%BF%AB%E6%8D%B7%E9%94%AE">8.1 救命快捷键</h2>
<ul>
<li><strong>Ctrl + C</strong>：中断正在运行的程序（最常用！）</li>
<li><strong>Tab</strong>：自动补全（手敲命令太慢？按两下 Tab 试试）</li>
<li><strong>↑ / ↓</strong>：翻阅你以前敲过的命令</li>
<li><strong>Ctrl + L</strong>：清空凌乱的屏幕</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
<h2 id="82-%E5%BD%93%E7%A8%8B%E5%BA%8F%E7%BD%A2%E5%B7%A5%E6%97%B6">8.2 当程序“罢工”时...</h2>
<ol>
<li><strong>找不到命令？</strong> 检查环境变量：<code>echo $ROS_PACKAGE_PATH</code></li>
<li><strong>节点连不上？</strong> 检查大脑还在吗：<code>rostopic list</code></li>
<li><strong>编译报错？</strong> 试试清理一下：<code>catkin_make clean</code></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="36" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40">
