</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="2" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="%E6%9C%AC%E8%8A%82%E7%9B%AE%E5%BD%95">本节目录</h2>
<ol>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="3" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="1-%E4%BB%80%E4%B9%88%E6%98%AF-npu-ius-%E7%AE%97%E6%B3%95">1 什么是 NPU-IUS 算法？</h1>
<h2 id="11-%E6%A0%B8%E5%BF%83%E5%AE%9A%E4%B9%89">1.1 核心定义</h2>
<p><strong>NPU-IUS 算法</strong> 是一种基于 <strong>激光雷达（Lidar）</strong> 数据的实时路径规划与避障控制算法。</p>
<p>它就像是无人车的“大脑”：</p>
<ul>
<li><strong>感知</strong>：通过雷达扫描周围环境。</li>
<li><strong>思考</strong>：在密集的障碍物中寻找“空隙”（Gap）。</li>
<li><strong>行动</strong>：计算出最安全、最快速的方向并踩下“油门”。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="4" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="12-%E6%AF%94%E5%96%BB%E6%B3%95%E7%90%86%E8%A7%A3">1.2 比喻法理解</h2>
<p>想象你在一个拥挤的商场里飞奔：</p>
<ol>
<li><strong>扫视</strong>：你迅速看一眼前方 180 度的范围。</li>
<li><strong>找路</strong>：你发现左侧有三个人，右侧有一堵墙，中间有一个 2 米宽的走廊。</li>
<li><strong>决策</strong>：你决定向中心走廊冲过去，并根据走廊的宽度决定是全速前进还是减速。</li>
</ol>
<p><strong>这，就是 NPU-IUS 在做的事情！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="5" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="2-%E7%AE%97%E6%B3%95%E6%A0%B8%E5%BF%83%E6%B5%81%E7%A8%8B%E6%A6%82%E8%A7%88">2 算法核心流程概览</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">graph TD
    A[获取雷达扫描数据] --&gt; B[数据清洗: 去噪声/补零]
    B --&gt; C[分割扫描数据: 左/右/前]
    C --&gt; D[识别离散点: 定位障碍物边界]
    D --&gt; E[间隙搜索: 寻找可通行通道]
    E --&gt; F[决策: Overtake / Follow / Normal]
    F --&gt; G[控制输出: PD 计算转向 + 动态限速]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="6" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="22-%E6%A0%B8%E5%BF%83%E5%87%BD%E6%95%B0middle_line_callback">2.2 核心函数：<code>middle_line_callback</code></h2>
<p>这是整个算法的“中枢神经”。</p>
<ul>
<li><strong>触发机制</strong>：每当激光雷达更新一次数据，该函数就会执行。</li>
<li><strong>职责范围</strong>：负责数据处理、环境识别、路径决策以及发送控制。</li>
<li><strong>输入信息</strong>：激光雷达的距离（Ranges）和光强（Intensities）。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="7" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="3-%E6%95%B0%E6%8D%AE%E9%A2%84%E5%A4%84%E7%90%86%E7%BB%99%E9%9B%B7%E8%BE%BE%E6%B4%97%E6%BE%A1">3 数据预处理：给雷达“洗澡”</h1>
<h2 id="31-%E9%9B%B6%E5%80%BC%E4%BF%AE%E5%A4%8D-fill_zeros_with_neighbors">3.1 零值修复 <code>fill_zeros_with_neighbors</code></h2>
<p>雷达有时会因为反射或角度问题返回 <code>0</code>。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">fill_zeros_with_neighbors</span>(<span class="hljs-params">data</span>):
    <span class="hljs-comment"># 如果当前点是 0，取它左侧或右侧的最近邻居</span>
    <span class="hljs-comment"># 就像你眯起眼看不清时，参考一下旁边的画面</span>
</code></pre>
<p><strong>目的</strong>：防止算法误以为前方有一个“无限远”的洞而冲过去。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="32-%E5%BC%82%E5%B8%B8%E7%82%B9%E6%BB%A4%E6%B3%A2-filter_anomalous_values">3.2 异常点滤波 <code>filter_anomalous_values</code></h2>
<p>去掉雷达数据中的“毛刺”。</p>
<p><strong>为什么要滤除？</strong><br />
如果不滤除，无人车会因为一个微小的噪点而突然转向，导致“蛇形走位”。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 核心逻辑：</span>
<span class="hljs-keyword">if</span> 当前点与两边差异巨大:
    用两边的平均值替换它
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="4-%E9%9A%9C%E7%A2%8D%E7%89%A9%E6%8F%90%E5%8F%96%E4%B8%8E%E8%86%A8%E8%83%80">4 障碍物提取与“膨胀”</h1>
<h2 id="41-%E8%AF%86%E5%88%AB%E9%9A%9C%E7%A2%8D%E7%89%A9%E8%BE%B9%E7%95%8C">4.1 识别障碍物边界</h2>
<p>通过计算前后两点雷达距离的<strong>变化率</strong>来确定障碍物的边缘。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 核心代码段</span>
<span class="hljs-keyword">if</span> dis_obs_90[i] - dis_obs_90[i+<span class="hljs-number">1</span>] &gt; THRESHOLD_obs:
    Left_obs_orig.append(i+<span class="hljs-number">1</span>) <span class="hljs-comment"># 发现障碍物入口</span>
<span class="hljs-keyword">elif</span> dis_obs_90[i+<span class="hljs-number">1</span>] - dis_obs_90[i] &gt; THRESHOLD_obs:
    Left_obs_orig.append(i) <span class="hljs-comment"># 发现障碍物出口</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="42-%E9%9A%9C%E7%A2%8D%E7%89%A9%E8%86%A8%E8%83%80">4.2 障碍物“膨胀”</h2>
<p>无人车是有宽度的。</p>
<ul>
<li><strong>膨胀逻辑</strong>：将识别出的障碍物范围向两边人为扩大约 10 个索引值。</li>
<li><strong>公式参考</strong>：<code>delta = min((end - start)/2 * (4 - middle_dist), 10)</code></li>
<li><strong>目的</strong>：给车身留出安全余量，防止“蹭墙”或“撞桶”。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="5-%E5%AF%BB%E6%89%BE%E6%9C%80%E4%BC%98%E5%89%8D%E8%BF%9B%E6%96%B9%E5%90%91">5 寻找最优前进方向</h1>
<h2 id="51-%E5%AF%BB%E6%89%BEgap%E9%97%B4%E9%9A%99">5.1 寻找“Gap”（间隙）</h2>
<p>在过滤完所有障碍物后，剩下的“白色区域”就是可通行的间隙。</p>
<ul>
<li><strong>广度优先</strong>：算法会优先寻找宽度大于 18 个索引（约 18 度）的间隙。</li>
<li><strong>补偿机制</strong>：如果一侧视野被遮挡严重，算法会自动向开阔一侧微调方向。</li>
<li><strong>示例</strong>：<code>max_dis_index</code> 补偿 <code>5 * abs(dist_left - dist_right)</code>。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="6-%E8%B7%9F%E9%9A%8F%E4%B8%8E%E8%B6%85%E8%BD%A6%E7%AD%96%E7%95%A5">6 跟随与超车策略</h1>
<h2 id="61-%E5%8A%A8%E6%80%81%E9%9A%9C%E7%A2%8D%E7%89%A9%E8%AF%86%E5%88%AB">6.1 动态障碍物识别</h2>
<p>算法不仅能避开墙壁，还能识别前方的动态对手。</p>
<ul>
<li><strong>光强分析（Intensity）</strong>：通过分析障碍物区域的反射光强差异来判断是否为车辆。</li>
<li><strong>逻辑</strong>：<code>if abs(avg_obs_inten - avg_scene_inten) &gt; 5</code> 则认为存在动态障碍物。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="62-%E5%86%B3%E7%AD%96%E5%88%86%E6%94%AF">6.2 决策分支</h2>
<p>根据间隙大小和障碍物性质，做出以下选择：</p>
<ul>
<li><strong>跟随模式（Follow）</strong>：前方有车且空间不够，限速为 <code>MIN_OBS_SPEED</code>（2.0m/s）。</li>
<li><strong>超车模式（Overtake）</strong>：发现大于 30 个索引的空隙，全速冲刺！</li>
<li><strong>正常模式（Normal）</strong>：赛道清空，按常规逻辑行驶。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="7-%E9%80%9F%E5%BA%A6%E4%B8%8E%E9%A9%B1%E5%8A%A8%E5%8A%9B%E7%9A%84%E6%8E%A7%E5%88%B6">7 速度与驱动力的控制</h1>
<h2 id="71-pd-%E6%8E%A7%E5%88%B6%E8%BD%AC%E5%90%91">7.1 PD 控制转向</h2>
<p>使用 <strong>PD 控制器</strong> 计算最终的 <code>steering_angle</code>。</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>转向角度</mtext><mo>=</mo><mi>P</mi><mo>⋅</mo><mtext>误差</mtext><mo>+</mo><mi>D</mi><mo>⋅</mo><mtext>误差变化</mtext></mrow><annotation encoding="application/x-tex">转向角度 = P \cdot 误差 + D \cdot \text{误差变化}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord cjk_fallback">转向角度</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.13889em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord cjk_fallback">误差</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.02778em;">D</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord text"><span class="mord cjk_fallback">误差变化</span></span></span></span></span></span></p><table>
<thead>
<tr>
<th style="text-align:left">参数</th>
<th style="text-align:left">赛道状态</th>
<th style="text-align:left">P 值</th>
<th style="text-align:left">D 值</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>P</strong></td>
<td style="text-align:left">直道</td>
<td style="text-align:left">1.1</td>
<td style="text-align:left">0.2</td>
</tr>
<tr>
<td style="text-align:left"><strong>P</strong></td>
<td style="text-align:left">弯道</td>
<td style="text-align:left">1.5</td>
<td style="text-align:left">0.2</td>
</tr>
<tr>
<td style="text-align:left"><strong>D</strong></td>
<td style="text-align:left">边界危急</td>
<td style="text-align:left">1.1</td>
<td style="text-align:left">0.5</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="72-%E9%80%9F%E5%BA%A6%E8%87%AA%E9%80%82%E5%BA%94%E8%AE%A1%E7%AE%97">7.2 速度自适应计算</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 速度计算核心公式</span>
speed = <span class="hljs-number">2.4</span> * (<span class="hljs-number">0.3</span> * math.exp(-np.clip(<span class="hljs-built_in">abs</span>(angle), <span class="hljs-number">0</span>, <span class="hljs-number">0.5</span>)) + <span class="hljs-number">0.7</span>)
</code></pre>
<ol>
<li><strong>指数级下降</strong>：角度越大，速度跌落越快。</li>
<li><strong>保底动力</strong>：<code>+0.7</code> 确保过弯时依然有动力，不会失速。</li>
<li><strong>动态增益</strong>：<code>speed_rate</code> 在直道上会以 1.05 的比例不断累乘，实现极速。</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="8-%E5%AE%9E%E6%88%98%E4%B8%8D%E5%90%8C%E8%B7%AF%E5%86%B5%E5%BA%94%E5%AF%B9%E7%AD%96%E7%95%A5">8 实战：不同路况应对策略</h1>
<h2 id="81-%E5%A4%A7%E7%9B%B4%E9%81%93%E7%8B%82%E9%A3%99">8.1 大直道狂飙</h2>
<p>当目标方向在 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>75</mn><mo>∘</mo></msup></mrow><annotation encoding="application/x-tex">75^\circ</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6741em;"></span><span class="mord">7</span><span class="mord"><span class="mord">5</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6741em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">∘</span></span></span></span></span></span></span></span></span></span></span> 到 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>105</mn><mo>∘</mo></msup></mrow><annotation encoding="application/x-tex">105^\circ</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6741em;"></span><span class="mord">10</span><span class="mord"><span class="mord">5</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6741em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">∘</span></span></span></span></span></span></span></span></span></span></span> 之间时进入“直道模式”。</p>
<ul>
<li><strong>策略</strong>：逐渐增加 <code>speed_rate</code>，封顶可达 3.0。</li>
<li><strong>判断依据</strong>：前方平均距离 <code>mean_straight</code> 越远，提速越狠。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h2 id="82-%E7%B4%A7%E6%80%A5%E5%A4%84%E7%90%86%E9%9A%90%E8%97%8F%E6%AC%BE">8.2 紧急处理：隐藏款</h2>
<p><strong>当雷达视野中完全找不到可行区域时（<code>max_dir_num == 0</code>）：</strong></p>
<ul>
<li><strong>动作</strong>：保持上一次的方向。</li>
<li><strong>降速</strong>：<code>speed_rate *= 0.9</code> 连续进入则持续减速。</li>
<li><strong>搜寻</strong>：<code>turn_rate</code> 提升至 1.2 倍，试图尽快偏转视野找路。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="9-%E8%BF%90%E8%A1%8C%E4%B8%8E%E6%93%8D%E4%BD%9C">9 运行与操作</h1>
<h2 id="91-%E6%A0%B8%E5%BF%83%E8%BF%90%E8%A1%8C%E6%96%B9%E6%B3%95">9.1 核心运行方法</h2>
<p>首先，我们需要通过 SSH 登录赛车，并启动它的底盘和感官。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 在赛车终端输入</span>
roslaunch tianracer_bringup tianracer_bringup.launch
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1. 启动npu-ius避障控制节点</span>
roslaunch tianracer_navigation npu_battle_fast2.launch
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 2. 交互观察终端输出</span>
rostopic <span class="hljs-built_in">echo</span> /tianracer/ackermann_cmd
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="%E6%9C%AC%E8%8A%82%E6%80%BB%E7%BB%93">本节总结</h1>
<table>
<thead>
<tr>
<th style="text-align:left">模块</th>
<th style="text-align:left">对应技术</th>
<th style="text-align:left">目标</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>前处理</strong></td>
<td style="text-align:left">均值滤波/零值修复</td>
<td style="text-align:left">提升雷达数据可靠性</td>
</tr>
<tr>
<td style="text-align:left"><strong>识别</strong></td>
<td style="text-align:left">梯度检测/区域膨胀</td>
<td style="text-align:left">确立绝对安全空间</td>
</tr>
<tr>
<td style="text-align:left"><strong>决策</strong></td>
<td style="text-align:left">间隙搜索/状态机</td>
<td style="text-align:left">选择最快超车线路</td>
</tr>
<tr>
<td style="text-align:left"><strong>执行</strong></td>
<td style="text-align:left">PD 控制/指数配速</td>
<td style="text-align:left">兼顾稳定与速度</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-image="url(&quot;../images/title.png&quot;)" data-theme="TsinghuaPPT" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-image:url(&quot;../images/title.png&quot;);--theme:TsinghuaPPT;background-image:url(&quot;../images/title.png&quot;);background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="22">
<h1 id="%E5%AE%9E%E8%B7%B5%E8%AF%BE%E9%A2%98">实践课题</h1>
<ol>
<li><strong>观察现象</strong>：在 RViz 中观察绿色箭头，看它在遇到障碍物时是如何偏转的。</li>
<li><strong>参数修改</strong>：尝试将弯道的 <code>P</code> 值从 1.5 改为 2.0，观察车辆转向是否更灵敏。</li>
<li><strong>安全第一</strong>：在修改 <code>MAX_SPEED_RATE</code> 后，请务必手持急停遥控器进行测试！</li>
</ol>
</section>
